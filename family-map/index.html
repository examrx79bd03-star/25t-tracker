<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>FAMILY MAP — 二人の思い出</title>

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FAMILY MAP">
<meta name="theme-color" content="#f4f1eb">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" href="../icon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4f1eb;
  --bg-elev: #faf8f3;
  --bg-elev-2: #ffffff;
  --border: #e3dfd6;
  --text: #2c2925;
  --text-dim: #847e74;
  --text-mute: #b0aaa0;
  --accent: #b67659;
  --accent-glow: rgba(182, 118, 89, 0.18);
  --danger: #b85a47;
  --visited: #7a9166;
  --want: #d4a14a;
  --memory: #c97b7b;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  font-feature-settings: 'kern' 1;
  user-select: none;
  -webkit-user-select: none;
}

.app {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 0.18em;
  display: flex;
  align-items: center;
  gap: 10px;
}
/* Brand dot doubles as the cloud connection indicator */
.brand-dot {
  width: 9px; height: 9px;
  background: var(--text-mute);
  border-radius: 50%;
  flex-shrink: 0;
  cursor: pointer;
  transition: background 0.3s, box-shadow 0.3s;
}
.brand-dot.connected {
  background: var(--visited);
  box-shadow: 0 0 10px rgba(122, 145, 102, 0.7);
  animation: brandGlow 2s ease-in-out infinite;
}
.brand-dot.syncing {
  background: var(--want);
  animation: brandPulse 1.4s ease-in-out infinite;
}
.brand-dot.error {
  background: var(--danger);
  box-shadow: 0 0 10px rgba(184, 90, 71, 0.5);
}
@keyframes brandGlow {
  0%, 100% { box-shadow: 0 0 8px rgba(122, 145, 102, 0.55); }
  50%      { box-shadow: 0 0 14px rgba(122, 145, 102, 0.9), 0 0 22px rgba(122, 145, 102, 0.35); }
}
@keyframes brandPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}
.date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

/* Filters */
.filters {
  display: flex;
  gap: 6px;
  padding: 10px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  z-index: 10;
}
.chip {
  flex-shrink: 0;
  padding: 7px 13px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chip.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.chip .swatch {
  width: 8px; height: 8px;
  border-radius: 50%;
}

/* Map */
.map-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#map {
  position: absolute;
  inset: 0;
  background: var(--bg-elev);
}

/* Floating buttons */
.fab {
  position: absolute;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  z-index: 500;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.94); }
.fab-locate {
  bottom: 18px;
  left: 14px;
  width: 44px;
  height: 44px;
  font-size: 18px;
}
.fab-list {
  bottom: 18px;
  right: 14px;
  height: 44px;
  padding: 0 16px;
}
.hint {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(44,41,37,0.88);
  color: var(--bg);
  font-size: 11px;
  padding: 6px 12px;
  border-radius: 999px;
  z-index: 500;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.hint.show { opacity: 1; }

/* Google Maps marker styling (custom PinElement colors are set via JS) */

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(44,41,37,0.45);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--bg-elev-2);
  width: 100%;
  max-width: 480px;
  border-radius: 18px 18px 0 0;
  padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.15em;
  margin-bottom: 14px;
  color: var(--text);
}

/* Mode chip: differentiates POI (named place) vs. open (free memo) */
.mode-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px 5px 9px;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 10px;
  border: 1px solid;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mode-chip.poi {
  background: var(--accent-glow);
  color: var(--accent);
  border-color: var(--accent);
}
.mode-chip.open {
  background: rgba(122, 145, 102, 0.14);
  color: var(--visited);
  border-color: var(--visited);
}
.mode-chip.detecting {
  background: var(--bg-elev);
  color: var(--text-dim);
  border-color: var(--border);
}
.mode-chip.hidden { display: none; }
.mode-chip .ic { font-size: 12px; line-height: 1; }
.spinner {
  width: 9px; height: 9px;
  border: 1.4px solid var(--text-mute);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Tint the modal subtly per mode */
.modal.mode-poi  { border-top: 3px solid var(--accent); }
.modal.mode-open { border-top: 3px solid var(--visited); }
.field { margin-bottom: 12px; }
.field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-mute);
  margin-bottom: 6px;
}
.input, .textarea {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 13px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--text);
  -webkit-appearance: none;
  user-select: text;
  -webkit-user-select: text;
}
.input:focus, .textarea:focus { outline: none; border-color: var(--accent); }
.textarea { min-height: 80px; resize: none; }

.status-row {
  display: flex;
  gap: 8px;
}
.status-btn {
  flex: 1;
  padding: 11px 6px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  transition: all 0.15s;
}
.status-btn .dot {
  width: 12px; height: 12px; border-radius: 50%;
}
.status-btn.selected {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.status-btn[data-status="visited"] .dot { background: var(--visited); }
.status-btn[data-status="want"] .dot    { background: var(--want); }
.status-btn[data-status="memory"] .dot  { background: var(--memory); }

.actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}
.btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--text);
  color: var(--bg);
}
.btn-ghost {
  background: var(--bg-elev);
  color: var(--text-dim);
  border-color: var(--border);
}
.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: var(--danger);
}

.coord {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-mute);
  letter-spacing: 0.05em;
  margin-top: 4px;
}

/* List view */
.list-view {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 999;
  display: none;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.list-view.open { display: flex; }
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.list-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 0.18em;
}
.close-btn {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  color: var(--text-dim);
}
.list-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.list-item:active { background: var(--bg-elev); }
.list-item .dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.list-item .body {
  flex: 1;
  min-width: 0;
}
.list-item .t {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-item .m {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-item .meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-mute);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-mute);
  font-size: 13px;
}

/* List view tabs (List / Calendar) */
.view-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.view-tab {
  flex: 1;
  padding: 12px 0;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  letter-spacing: 0.05em;
}
.view-tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}
.list-sub {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.list-sub.hidden { display: none; }

/* Search + sort toolbar */
.list-toolbar {
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg);
}
.search-row {
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 9px 34px 9px 36px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text);
  user-select: text;
  -webkit-user-select: text;
  -webkit-appearance: none;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: var(--text-mute);
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px; height: 26px;
  border-radius: 50%;
  border: none;
  background: var(--border);
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  display: none;
}
.search-input:not(:placeholder-shown) + .search-clear { display: block; }

.sort-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.sort-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-mute);
  flex-shrink: 0;
}
.sort-sel {
  flex: 1;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 26px 7px 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--text);
  -webkit-appearance: none;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
                    linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.sort-dir {
  width: 34px;
  height: 32px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Address line in list items */
.list-item .addr {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-mute);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

/* Calendar */
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.cal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 0.18em;
}
.cal-nav {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 999px;
  width: 32px;
  height: 32px;
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cal-nav:active { transform: scale(0.94); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 6px 8px 4px;
  gap: 2px;
}
.cal-dow {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-mute);
  padding: 4px 0;
  letter-spacing: 0.1em;
}
.cal-dow.sun { color: var(--memory); }
.cal-dow.sat { color: var(--accent); }
.cal-cell {
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  cursor: pointer;
  position: relative;
  background: transparent;
  border: 1px solid transparent;
  padding: 0;
}
.cal-cell:disabled { cursor: default; }
.cal-cell.other-month { color: var(--text-mute); opacity: 0.4; }
.cal-cell.has-pins { font-weight: 700; }
.cal-cell.today { border-color: var(--border); }
.cal-cell.selected {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.cal-dots {
  position: absolute;
  bottom: 5px;
  display: flex;
  gap: 2px;
}
.cal-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
}
.cal-cell.selected .cal-dot {
  box-shadow: 0 0 0 1px var(--bg);
}
.cal-day-pins {
  flex: 1;
  overflow-y: auto;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.cal-day-empty {
  text-align: center;
  padding: 24px 20px;
  color: var(--text-mute);
  font-size: 12px;
}

/* Header right cluster (cloud status + date) */
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
/* Generic round icon button (e.g. settings gear in header) */
.icon-btn {
  background: none;
  border: none;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 1;
  color: var(--text-dim);
  border-radius: 50%;
  cursor: pointer;
  padding: 0;
  transition: background 0.15s, transform 0.1s;
}
.icon-btn:hover { color: var(--text); }
.icon-btn:active { transform: scale(0.9); background: var(--bg-elev); }

/* Family setup modal */
.family-modal { border-top: 3px solid var(--accent); }
.family-desc {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 6px;
}
.family-code-box {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-align: center;
  padding: 18px 12px;
  background: var(--bg-elev);
  border: 2px dashed var(--accent);
  border-radius: 12px;
  color: var(--text);
  margin: 14px 0 12px;
  user-select: text;
  -webkit-user-select: text;
  word-break: break-all;
}
.family-section { display: none; }
.family-section.active { display: block; }
.family-actions-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 18px;
}

/* Settings sheet (small one for showing/managing family code) */
.settings-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }
.settings-row-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-mute);
  margin-bottom: 6px;
}
.settings-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text);
  user-select: text;
  -webkit-user-select: text;
}

/* Google Maps customization */
#map { background: var(--bg-elev); }
/* Hide Google's built-in POI info window we don't use (we replace with our own modal) */
.gm-style-iw-c { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <span class="brand-dot" id="cloudStatus" title="クラウド接続状態"></span>
      FAMILY MAP
    </div>
    <div class="header-right">
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定" title="設定">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="4" x2="5" y2="10"/>
          <line x1="5" y1="14" x2="5" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="14"/>
          <line x1="12" y1="18" x2="12" y2="20"/>

/* ---------- Reverse-geocoding + Place lookup (Google) ---------- */

const placeCache = new Map(); // placeId -> { displayName, formattedAddress, fetchedAt }

async function fetchPlace(placeId) {
  const cached = placeCache.get(placeId);
  if (cached && Date.now() - cached.fetchedAt < 24 * 3600 * 1000) return cached;
  try {
    const place = new GPlaces.Place({ id: placeId, requestedLanguage: 'ja', requestedRegion: 'JP' });
    await place.fetchFields({ fields: ['displayName', 'formattedAddress'] });
    const out = {
      displayName: place.displayName || '',
      formattedAddress: place.formattedAddress || '',
      fetchedAt: Date.now(),
    };
    placeCache.set(placeId, out);
    return out;
  } catch (e) {
    console.warn('fetchPlace failed', e);
    return null;
  }
}

async function reverseGeocode(lat, lng) {
  if (!geocoderInst) return null;
  try {
    const res = await geocoderInst.geocode({ location: { lat, lng }, language: 'ja', region: 'JP' });
    return res.results && res.results[0] ? res.results[0] : null;
  } catch (e) {
    console.warn('geocode failed', e);
    return null;
  }
}

function pinDateKey(ts) {

}

/* ---------- Cloud sync ---------- */

const FAMILY_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // no 0,1,I,L,O
function generateFamilyCode() {
  let s = '';
  for (let i = 0; i < 10; i++) {
    s += FAMILY_ALPHABET[Math.floor(Math.random() * FAMILY_ALPHABET.length)];
  }
  return s;
}
function fmtFamilyCode(code) {
  if (!code) return '';
  return code.match(/.{1,4}/g).join('-');
}
function normalizeFamilyCode(s) {
  return (s || '').toUpperCase().replace(/[^A-Z2-9]/g, '');
}
function isValidFamilyCode(s) {
  return /^[A-Z2-9]{10}$/.test(s);
}

function setCloudStatus(state) {
  const el = document.getElementById('cloudStatus');
  el.classList.remove('connected', 'syncing', 'error');
  if (state) el.classList.add(state);
  const titles = {
    connected: 'クラウド接続中',
    syncing:   'クラウド同期中…',
    error:     'クラウド接続エラー',
    '':        '未接続',
  };
  el.title = titles[state] || '';
}

function pinToCloud(p) {
  return {
    title: p.title || '',
    memo: p.memo || '',
    status: p.status || 'want',
    address: p.address || '',
    placeId: p.placeId || '',
    lat: p.lat,
    lng: p.lng,
    createdAt: p.createdAt || Date.now(),
    updatedAt: p.updatedAt || Date.now(),
  };
}

function upsertPinFromCloud(id, data) {
  const idx = pins.findIndex(p => p.id === id);
  const incoming = { id, ...data };
  if (idx >= 0) {
    if ((incoming.updatedAt || 0) >= (pins[idx].updatedAt || 0)) {
      pins[idx] = incoming;
      const m = markers.get(id);
      if (m && GMarker) m.content = makePinElement(incoming.status).element;
    }
  } else {
    pins.push(incoming);
    if (map) addMarker(incoming);
  }
}

function removePinFromCloud(id) {
  const m = markers.get(id);
  if (m) m.map = null;
  markers.delete(id);
  pins = pins.filter(p => p.id !== id);
}

async function connectToFamily(id) {
  if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
  familyId = id;
  localStorage.setItem(FAMILY_KEY, id);
  cloudReady = false;
  initialSyncDone = false;
  setCloudStatus('syncing');

  // Upload any pre-existing local pins (merge into family doc set)
  if (pins.length > 0) {
    const batch = writeBatch(fbDb);
    pins.forEach(p => {
      const ref = doc(fbDb, 'families', id, 'pins', p.id);
      batch.set(ref, pinToCloud(p), { merge: true });
    });
    try { await batch.commit(); } catch (e) { console.error('initial upload failed', e); }
  }

  // Subscribe to family pins
  const colRef = collection(fbDb, 'families', id, 'pins');
  cloudUnsub = onSnapshot(colRef, (snap) => {
    snap.docChanges().forEach((change) => {
      const data = change.doc.data();
      if (change.type === 'removed') {
        removePinFromCloud(change.doc.id);
      } else {
        upsertPinFromCloud(change.doc.id, data);
      }
    });
    persist();
    refreshVisibility();
    if (document.getElementById('listView').classList.contains('open')) {
      if (listSubView === 'list') renderList();
      else { renderCalendar(); }
    }
    cloudReady = true;
    initialSyncDone = true;
    setCloudStatus('connected');
  }, (err) => {
    console.error('snapshot error', err);
    setCloudStatus('error');
  });
}

async function cloudWritePin(pin) {
  if (!familyId) return;
  try {
    const ref = doc(fbDb, 'families', familyId, 'pins', pin.id);
    await setDoc(ref, pinToCloud(pin));
  } catch (e) {
    console.error('cloudWritePin', e);
  }
}

async function cloudDeletePin(id) {
  if (!familyId) return;
  try {
    const ref = doc(fbDb, 'families', familyId, 'pins', id);
    await deleteDoc(ref);
  } catch (e) {
    console.error('cloudDeletePin', e);
  }
}

async function initCloud() {
  setCloudStatus('syncing');
  try {
    await signInAnonymously(fbAuth);
  } catch (e) {
    console.error('sign-in failed', e);
    setCloudStatus('error');
    showHint('クラウド接続に失敗しました', 3000);
    return;
  }
  if (familyId && isValidFamilyCode(familyId)) {
    await connectToFamily(familyId);
  } else {
    setCloudStatus('');
    showFamilySetup();
  }
}

// Lazily fill in addresses for pre-existing pins using Google Geocoder
async function backfillAddresses() {
  if (backfillRunning || !geocoderInst) return;
  backfillRunning = true;
  try {
    for (const p of pins) {
      if (p.address) continue;
      const data = await reverseGeocode(p.lat, p.lng);
      if (data && data.formatted_address) {
        p.address = data.formatted_address;
        persist();
        if (document.getElementById('listView').classList.contains('open')) {
          if (listSubView === 'list') renderList();
          else renderCalendarDayPins();
        }
      }
      // small gap to avoid hammering when many pins exist
      await new Promise(r => setTimeout(r, 150));
    }
  } finally {
    backfillRunning = false;
  }
}

function setMode(mode, name) {
  const chip = document.getElementById('modeChip');
  const modal = document.getElementById('modal');
  modal.classList.remove('mode-poi', 'mode-open', 'mode-detecting', 'mode-existing');
  chip.classList.remove('poi', 'open', 'detecting', 'hidden');

  if (mode === 'existing') {
    chip.classList.add('hidden');
    return;
  }
  modal.classList.add('mode-' + mode);
  chip.classList.add(mode);

  if (mode === 'detecting') {
    chip.innerHTML = '<span class="spinner"></span>場所を確認中…';
  } else if (mode === 'poi') {
    chip.innerHTML = `<span class="ic">📍</span>${escapeHtml(name)}`;
  } else if (mode === 'open') {
    chip.innerHTML = '<span class="ic">✏️</span>自由メモのスポット';
  }
}

function addMarker(pin) {
  if (!GMarker || !map) return;
  const m = new GMarker.AdvancedMarkerElement({
    position: { lat: pin.lat, lng: pin.lng },
    map,
    content: makePinElement(pin.status).element,
    title: pin.title || '',
    gmpClickable: true,
  });
  m.addListener('click', (e) => {
    e?.domEvent?.stopPropagation?.();
    openEditor(pin.id);
  });
  markers.set(pin.id, m);
}

function refreshVisibility() {
  pins.forEach(p => {
    const m = markers.get(p.id);
    if (!m) return;
    const show = currentFilter === 'all' || p.status === currentFilter;
    m.map = show ? map : null;
  });
  document.getElementById('count').textContent = visibleCount();
}

function openEditor(id, latlng, placeId) {
  editingId = id || null;
  pendingLatLng = latlng || null;
  pendingPlaceId = placeId || null;
  const pin = id ? pins.find(p => p.id === id) : null;
  const lat = pin ? pin.lat : (latlng && latlng.lat);
  const lng = pin ? pin.lng : (latlng && latlng.lng);

  document.getElementById('modalTitle').textContent = pin ? 'ピンを編集' : 'ピンを追加';
  document.getElementById('titleInput').value = pin ? pin.title : '';
  document.getElementById('memoInput').value = pin ? pin.memo : '';
  document.getElementById('coord').textContent = lat && lng ? `${lat.toFixed(5)}, ${lng.toFixed(5)}` : '';
  document.getElementById('deleteBtn').style.display = pin ? 'block' : 'none';

  document.querySelectorAll('.status-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.status === (pin ? pin.status : 'want'));
  });

  document.getElementById('modalBg').classList.add('open');

  // Existing pin: skip POI lookup. New pin: detect what's there.
  pendingAddress = '';
  if (pin) {
    setMode('existing');
  } else if (latlng) {
    setMode('detecting');
    const token = ++geocodeToken;
    detectPlace(latlng, placeId).then(result => {
      if (token !== geocodeToken) return; // user moved on
      pendingAddress = result.address || '';
      if (result.type === 'poi') {
        setMode('poi', result.name);
        const t = document.getElementById('titleInput');
        if (!t.value.trim()) t.value = result.name;
      } else {
        setMode('open');
      }
    });
  }
}

async function detectPlace(latlng, placeId) {
  // If user clicked an actual POI label, use Places API (much more accurate than geocoding)
  if (placeId) {
    const data = await fetchPlace(placeId);
    if (data && data.displayName) {
      return { type: 'poi', name: data.displayName, address: data.formattedAddress };
    }
  }
  // Fall back to reverse geocoding for an empty-map tap
  const result = await reverseGeocode(latlng.lat, latlng.lng);
  return { type: 'open', name: '', address: result?.formatted_address || '' };
}

function closeEditor() {
  document.getElementById('modalBg').classList.remove('open');
  editingId = null;
  pendingLatLng = null;
  pendingPlaceId = null;
  geocodeToken++;
}

function savePin() {
  const title = document.getElementById('titleInput').value.trim() || '無題';
  const memo = document.getElementById('memoInput').value.trim();
  const selected = document.querySelector('.status-btn.selected');
  const status = selected ? selected.dataset.status : 'want';
  const now = Date.now();
  let saved = null;

  if (editingId) {
    const pin = pins.find(p => p.id === editingId);
    if (!pin) { closeEditor(); return; }
    pin.title = title;
    pin.memo = memo;
    pin.status = status;
    pin.updatedAt = now;
    const m = markers.get(pin.id);
    if (m && GMarker) m.content = makePinElement(status).element;
    saved = pin;
  } else {
    if (!pendingLatLng) { closeEditor(); return; }
    const pin = {
      id: uuid(),
      title, memo, status,
      address: pendingAddress || '',
      placeId: pendingPlaceId || '',
      lat: pendingLatLng.lat,
      lng: pendingLatLng.lng,
      createdAt: now,
      updatedAt: now,
    };
    pins.push(pin);
    addMarker(pin);
    saved = pin;
  }
  persist();
  refreshVisibility();
  closeEditor();
  if (saved) cloudWritePin(saved);
}

function deletePin() {
  if (!editingId) return;
  if (!confirm('このピンを削除しますか？')) return;
  const idToDelete = editingId;
  const m = markers.get(idToDelete);
  if (m) m.map = null;
  markers.delete(idToDelete);
  pins = pins.filter(p => p.id !== idToDelete);
  persist();
  refreshVisibility();
  closeEditor();
  cloudDeletePin(idToDelete);
}

function locate() {
  if (!navigator.geolocation) {
    showHint('現在地は使えません', 2000);
    return;
  }
  if (!map) return;
  showHint('現在地を取得中...', 1500);
  navigator.geolocation.getCurrentPosition(
    (p) => {
      map.panTo({ lat: p.coords.latitude, lng: p.coords.longitude });
      map.setZoom(16);
    },
    () => showHint('現在地を取得できませんでした', 2000),
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}

let hintTimer = null;
function showHint(text, ms = 2000) {
  const h = document.getElementById('hint');
  h.textContent = text;
  h.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.remove('show'), ms);
}

function listItemHtml(p) {
  return `
    <div class="list-item" data-id="${p.id}">
      <span class="dot" style="background: var(--${STATUS[p.status].cls})"></span>
      <div class="body">
        <div class="t">${escapeHtml(p.title)}</div>
        ${p.address ? `<div class="addr">${escapeHtml(p.address)}</div>` : ''}
        <div class="m">${escapeHtml(p.memo || '—')}</div>
      </div>
      <div class="meta">${fmtDate(p.createdAt || p.updatedAt)}</div>
    </div>
  `;
}

function attachItemHandlers(container) {
  container.querySelectorAll('.list-item').forEach(el => {
    el.onclick = () => {
      const pin = pins.find(p => p.id === el.dataset.id);
      if (!pin) return;
      closeListView();
      map.panTo({ lat: pin.lat, lng: pin.lng });
      map.setZoom(16);
      setTimeout(() => openEditor(pin.id), 250);
    };
  });
}

function applySearchAndSort(items) {
  const q = searchQuery.trim().toLowerCase();
  let arr = items;
  if (q) {
    arr = arr.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      (p.memo  || '').toLowerCase().includes(q) ||
      (p.address || '').toLowerCase().includes(q)
    );
  }
  const dir = sortDir === 'asc' ? 1 : -1;
  arr = arr.slice().sort((a, b) => {
    let av, bv;
    if (sortKey === 'createdAt') {
      av = a.createdAt || a.updatedAt || 0;
      bv = b.createdAt || b.updatedAt || 0;
    } else {
      av = (a[sortKey] || '').toString().toLowerCase();
      bv = (b[sortKey] || '').toString().toLowerCase();
      // Push empties to the end regardless of direction
      if (!av && bv) return 1;
      if (av && !bv) return -1;
    }
    if (av < bv) return -1 * dir;
    if (av > bv) return  1 * dir;
    return 0;
  });
  return arr;
}

function renderList() {
  const body = document.getElementById('listBody');
  const base = pins.filter(p => currentFilter === 'all' || p.status === currentFilter);
  const filtered = applySearchAndSort(base);

  if (filtered.length === 0) {
    const msg = pins.length === 0
      ? 'まだピンがありません。<br>地図をタップして追加してみましょう。'
      : '一致するピンがありません。';
    body.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  body.innerHTML = filtered.map(listItemHtml).join('');
  attachItemHandlers(body);
}

/* ---------- Calendar ---------- */

function renderCalendar() {
  if (!calCursor) {
    const d = new Date();
    calCursor = { year: d.getFullYear(), month: d.getMonth() };
  }
  const { year, month } = calCursor;
  document.getElementById('calTitle').textContent =
    year + '.' + String(month+1).padStart(2,'0');

  // Group visible pins (after status filter only — search not applied to calendar dots)
  const byDate = new Map();
  pins
    .filter(p => currentFilter === 'all' || p.status === currentFilter)
    .forEach(p => {
      const k = pinDateKey(p.createdAt || p.updatedAt);
      if (!byDate.has(k)) byDate.set(k, []);
      byDate.get(k).push(p);
    });

  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = pinDateKey(Date.now());

  const dowNames = [
    { n: '日', cls: 'sun' }, { n: '月', cls: '' }, { n: '火', cls: '' },
    { n: '水', cls: '' }, { n: '木', cls: '' }, { n: '金', cls: '' },
    { n: '土', cls: 'sat' },
  ];
  let html = dowNames.map(d => `<div class="cal-dow ${d.cls}">${d.n}</div>`).join('');

  // Leading blanks
  for (let i = 0; i < startDow; i++) {
    html += `<button class="cal-cell other-month" disabled></button>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const pinsHere = byDate.get(key) || [];
    const statuses = [...new Set(pinsHere.map(p => p.status))];
    const dots = statuses.map(s =>
      `<span class="cal-dot" style="background: var(--${STATUS[s].cls})"></span>`
    ).join('');
    const cls = [
      'cal-cell',
      pinsHere.length > 0 ? 'has-pins' : '',
      key === todayKey ? 'today' : '',
      key === calSelectedDay ? 'selected' : '',
    ].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-date="${key}">${d}${dots ? `<span class="cal-dots">${dots}</span>` : ''}</button>`;
  }
  // Trailing blanks
  const totalCells = startDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) {
    html += `<button class="cal-cell other-month" disabled></button>`;
  }

  const grid = document.getElementById('calGrid');
  grid.innerHTML = html;
  grid.querySelectorAll('[data-date]').forEach(el => {
    el.onclick = () => {
      calSelectedDay = calSelectedDay === el.dataset.date ? null : el.dataset.date;
      renderCalendar();
      renderCalendarDayPins();
    };
  });

  renderCalendarDayPins();
}

function renderCalendarDayPins() {
  const wrap = document.getElementById('calDayPins');
  if (!calSelectedDay) {
    wrap.innerHTML = '<div class="cal-day-empty">日付をタップしてピンを表示</div>';
    return;
  }
  const day = pins
    .filter(p => currentFilter === 'all' || p.status === currentFilter)
    .filter(p => pinDateKey(p.createdAt || p.updatedAt) === calSelectedDay)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  if (day.length === 0) {
    wrap.innerHTML = '<div class="cal-day-empty">この日のピンはありません</div>';
    return;
  }
  wrap.innerHTML = day.map(listItemHtml).join('');
  attachItemHandlers(wrap);
}

function setListSubView(view) {
  listSubView = view;
  document.getElementById('subList').classList.toggle('hidden', view !== 'list');
  document.getElementById('subCalendar').classList.toggle('hidden', view !== 'calendar');
  document.querySelectorAll('.view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  if (view === 'list') renderList();
  else renderCalendar();
  savePrefs();
}

function openListView() {
  // Sync controls with persisted prefs
  document.getElementById('sortKey').value = sortKey;
  document.getElementById('sortDir').textContent = sortDir === 'asc' ? '↑' : '↓';
  document.getElementById('searchInput').value = searchQuery;
  setListSubView(listSubView);
  document.getElementById('listView').classList.add('open');
  backfillAddresses();
}
function closeListView() {
  document.getElementById('listView').classList.remove('open');
}

function setDate() {
  const d = new Date();
  document.getElementById('date').textContent =
    d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

async function initGoogleMap() {
  GMaps     = await google.maps.importLibrary('maps');
  GMarker   = await google.maps.importLibrary('marker');
  GPlaces   = await google.maps.importLibrary('places');
  GGeocoder = await google.maps.importLibrary('geocoding');
  geocoderInst = new GGeocoder.Geocoder();

  map = new GMaps.Map(document.getElementById('map'), {
    center: { lat: DEFAULT_VIEW.lat, lng: DEFAULT_VIEW.lng },
    zoom: DEFAULT_VIEW.zoom,
    mapId: MAP_ID,
    disableDefaultUI: true,
    zoomControl: false,
    gestureHandling: 'greedy',
    clickableIcons: true, // allow POI taps to fire click with placeId
    keyboardShortcuts: false,
  });

  map.addListener('click', (e) => {
    // Some clicks (POI taps) include a placeId on the event
    const placeId = e.placeId || null;
    if (placeId && typeof e.stop === 'function') e.stop(); // suppress the default Google info popup
    const latlng = { lat: e.latLng.lat(), lng: e.latLng.lng() };
    openEditor(null, latlng, placeId);
  });
}

async function init() {
  setDate();
  await initGoogleMap();

  pins.forEach(addMarker);
  document.getElementById('count').textContent = visibleCount();

  if (pins.length === 0) {
    setTimeout(() => showHint('地図をタップしてピンを追加', 3000), 500);
  }

  locate();

  // Buttons
  document.getElementById('locateBtn').onclick = locate;
  document.getElementById('listBtn').onclick = openListView;
  document.getElementById('listCloseBtn').onclick = closeListView;
  document.getElementById('saveBtn').onclick = savePin;
  document.getElementById('cancelBtn').onclick = closeEditor;
  document.getElementById('deleteBtn').onclick = deletePin;

  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeEditor();
  });

  // Filter chips
  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      currentFilter = chip.dataset.filter;
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
      refreshVisibility();
      // If list view is open, refresh its current sub-view too
      if (document.getElementById('listView').classList.contains('open')) {
        if (listSubView === 'list') renderList();
        else renderCalendar();
      }
    };
  });

  // List view tabs
  document.querySelectorAll('.view-tab').forEach(tab => {
    tab.onclick = () => setListSubView(tab.dataset.view);
  });

  // Search
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    renderList();
  });
  document.getElementById('searchClear').onclick = () => {
    searchInput.value = '';
    searchQuery = '';
    renderList();
    searchInput.focus();
  };

  // Sort
  document.getElementById('sortKey').addEventListener('change', (e) => {
    sortKey = e.target.value;
    renderList();
    savePrefs();
  });
  document.getElementById('sortDir').onclick = (e) => {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    e.currentTarget.textContent = sortDir === 'asc' ? '↑' : '↓';
    renderList();
    savePrefs();
  };

  // Calendar nav
  document.getElementById('calPrev').onclick = () => {
    calCursor.month--;
    if (calCursor.month < 0) { calCursor.month = 11; calCursor.year--; }
    renderCalendar();
  };
  document.getElementById('calNext').onclick = () => {
    calCursor.month++;
    if (calCursor.month > 11) { calCursor.month = 0; calCursor.year++; }
    renderCalendar();
  };

  // Status picker (in modal)
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });

  // Cloud status dot: show a transient hint about the connection state
  document.getElementById('cloudStatus').onclick = () => {
    if (!familyId) showHint('未接続 — 設定から家族コードを設定', 2000);
    else if (cloudReady) showHint('クラウド接続中', 1500);
    else showHint('同期中…', 1500);
  };

  // Settings (gear icon)
  document.getElementById('settingsBtn').onclick = () => {
    if (!familyId) showFamilySetup();
    else openSettings();
  };

  // Family setup modal
  document.getElementById('famCreateBtn').onclick = () => {
    const code = generateFamilyCode();
    document.getElementById('famCodeDisplay').textContent = fmtFamilyCode(code);
    document.getElementById('famDoneBtn').dataset.code = code;
    showFamilySection('famCreated');
  };
  document.getElementById('famJoinBtn').onclick = () => {
    document.getElementById('famCodeInput').value = '';
    showFamilySection('famJoinForm');
  };
  document.getElementById('famJoinBackBtn').onclick = () => showFamilySection('famChooser');
  document.getElementById('famDoneBtn').onclick = () => {
    const code = document.getElementById('famDoneBtn').dataset.code;
    if (!code) return;
    localStorage.setItem(FAMILY_KEY, code);
    location.reload();
  };
  document.getElementById('famCopyBtn').onclick = async () => {
    const code = document.getElementById('famDoneBtn').dataset.code || '';
    try {
      await navigator.clipboard.writeText(fmtFamilyCode(code));
      showHint('コピーしました', 1500);
    } catch {
      showHint('コピーできませんでした', 2000);
    }
  };
  document.getElementById('famJoinSubmitBtn').onclick = () => {
    const raw = document.getElementById('famCodeInput').value;
    const code = normalizeFamilyCode(raw);
    if (!isValidFamilyCode(code)) {
      showHint('コード形式が正しくありません', 2500);
      return;
    }
    localStorage.setItem(FAMILY_KEY, code);
    location.reload();
  };

  // Settings modal
  document.getElementById('settingsCloseBtn').onclick = closeSettings;
  document.getElementById('settingsCopyBtn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(fmtFamilyCode(familyId));
      showHint('コピーしました', 1500);
    } catch {
      showHint('コピーできませんでした', 2000);
    }
  };
  document.getElementById('settingsLeaveBtn').onclick = () => {
    if (!confirm('この家族から離脱しますか？\nローカルのピンは残りますが、クラウド同期は停止します。')) return;
    localStorage.removeItem(FAMILY_KEY);
    location.reload();
  };
  document.getElementById('settingsBg').addEventListener('click', (e) => {
    if (e.target.id === 'settingsBg') closeSettings();
  });

  // Bootstrap cloud sync
  initCloud();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
